[project]
name = "logistics-crew"
version = "0.1.0"
description = "CrewAI read-only shipping CLI with mock data and execution reports"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "crewai>=0.86.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
logistics-crew = "logistics_crew.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logistics_crew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that call a real LLM (require OPENAI_API_KEY)",
]
